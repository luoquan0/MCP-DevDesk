name: Apply Minimized Screen Vision Patch

on:
  push:
    branches:
      - "fix/screen-vision-minimized-windows"

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/screen-vision-minimized-windows
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply patch
        shell: pwsh
        run: |
          $patchPath = "tools\apply-screen-minimized.py"
          $patchContent = Get-Content -LiteralPath $patchPath -Raw -Encoding utf8
          $patchContent = $patchContent.Replace('\t\t\tsort.SliceStable', '\t\tsort.SliceStable')
          Set-Content -LiteralPath $patchPath -Value $patchContent -Encoding utf8 -NoNewline
          python .\tools\apply-screen-minimized.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci

      - name: Guard public repository secrets
        shell: pwsh
        run: .\tools\check-public-release.ps1

      - name: Build and test
        shell: pwsh
        env:
          MCP_DEVDESK_GITHUB_REPOSITORY: ${{ github.repository }}
        run: .\build.ps1 -Arch amd64 -RunTests

      - name: Commit validated patch
        shell: pwsh
        run: |
          Remove-Item -LiteralPath ".github\workflows\apply-screen-minimized.yml" -Force
          Remove-Item -LiteralPath "tools\apply-screen-minimized.py" -Force
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw "validated patch produced no changes" }
          git commit -m "fix: support minimized windows in Screen Vision"
          git push origin HEAD:fix/screen-vision-minimized-windows
