name: Agent Runtime Beta Validation

on:
  push:
    branches:
      - "feature/agent-runtime-v1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci

      - name: Guard public repository secrets
        shell: pwsh
        run: .\tools\check-public-release.ps1

      - name: Agent Runtime targeted tests
        shell: pwsh
        run: |
          Set-Location app
          go test -mod=vendor ./internal/agentstate ./internal/mcpcore ./internal/application ./internal/web ./internal/config ./internal/secrets ./internal/process -count=1 2>&1 | Tee-Object -FilePath ..\agent-runtime-targeted-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full Windows build and tests
        shell: pwsh
        env:
          MCP_DEVDESK_GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          .\build.ps1 -Arch amd64 -RunTests 2>&1 | Tee-Object -FilePath agent-runtime-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate beta version and unchanged Screen Vision baseline files
        shell: pwsh
        run: |
          $version = Get-Content -LiteralPath app\internal\buildinfo\version.go -Raw
          if ($version -notmatch 'const Version = "0\.13\.0-beta\.1"') { throw "Unexpected beta version" }
          $changed = git diff --name-only ${{ github.event.before }} ${{ github.sha }}
          $forbidden = $changed | Where-Object { $_ -match '^app/internal/mcpcore/screen_(capture|minimized|wgc|region).*\.go$' }
          if ($forbidden) { throw "Stable Screen Vision capture implementation changed: $($forbidden -join ', ')" }

      - name: Create validation checksums
        shell: pwsh
        run: |
          $assets = @(
            "dist\MCP-DevDesk-amd64.exe",
            "dist\MCP-DevDesk-Portable-amd64.zip",
            "dist\devdesk-updater-amd64.exe",
            "dist\devdeskctl-amd64.exe",
            "dist\mcp-core-amd64.exe"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing validation asset: $asset" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $asset
            Set-Content -LiteralPath ($asset + ".sha256") -Value ($hash + "  " + $name) -Encoding ASCII
          }
          @"
          UNRELEASED AGENT RUNTIME BETA VALIDATION
          Source commit: ${{ github.sha }}
          Version: 0.13.0-beta.1
          Stable v0.12.34 is not modified by this workflow.
          "@ | Set-Content -LiteralPath VALIDATION-BUILD.txt -Encoding utf8

      - name: Upload validation build
        uses: actions/upload-artifact@v4
        with:
          name: MCP-DevDesk-agent-runtime-beta-validation-${{ github.sha }}
          path: |
            dist/MCP-DevDesk-amd64.exe
            dist/MCP-DevDesk-amd64.exe.sha256
            dist/MCP-DevDesk-Portable-amd64.zip
            dist/MCP-DevDesk-Portable-amd64.zip.sha256
            dist/devdesk-updater-amd64.exe
            dist/devdesk-updater-amd64.exe.sha256
            dist/devdeskctl-amd64.exe
            dist/devdeskctl-amd64.exe.sha256
            dist/mcp-core-amd64.exe
            dist/mcp-core-amd64.exe.sha256
            agent-runtime-targeted-tests.txt
            agent-runtime-build.txt
            VALIDATION-BUILD.txt
          retention-days: 7
