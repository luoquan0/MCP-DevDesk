name: Apply update card click fix

on:
  push:
    paths:
      - '.github/workflows/apply-update-card-click-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply-update-card-click-fix.py
      - name: Sanity check patched UI
        shell: bash
        run: |
          grep -q 'scheduleUpdateProxyAutoSave' frontend/src/pages/SettingsPage.vue
          grep -q 'software-update-actions' frontend/src/pages/SettingsPage.vue
          grep -q '已使用代理模式' frontend/src/stores/app.ts
          grep -q 'backdrop-filter: none' frontend/src/styles/main.css
      - name: Remove one-shot patch files
        run: git rm tools/apply-update-card-click-fix.py .github/workflows/apply-update-card-click-fix.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/SettingsPage.vue frontend/src/stores/app.ts frontend/src/styles/main.css
          git commit -m 'fix: harden updater card interaction'
          git push origin HEAD:main
