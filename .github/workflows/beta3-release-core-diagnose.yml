name: Diagnose published Beta 3 core

on:
  push:
    branches:
      - "preview/v0.13.0"
    paths:
      - ".github/workflows/beta3-release-core-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Download published Beta 3 core
        shell: pwsh
        run: |
          $url = 'https://github.com/luoquan0/MCP-DevDesk/releases/download/v0.13.0-beta.3/mcp-core-amd64.exe'
          Invoke-WebRequest -Uri $url -OutFile mcp-core-beta3.exe
          $hash = (Get-FileHash .\mcp-core-beta3.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "releaseCoreSha256=$hash"
          if ($hash -ne 'c59378dec49e5d99ddd81382e7f900c4581c1ce78372a7c12ce2c94ea892b4f6') {
            throw "Published core SHA256 mismatch: $hash"
          }

      - name: Query published core tools/list
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP 'beta3-core-workspace'
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          $config = Join-Path $env:RUNNER_TEMP 'beta3-screen-config.json'
          '{"screenCaptureEnabled":true,"screenCaptureMode":"active","screenCaptureWindowId":"","screenCaptureWindowProcessId":0}' | Set-Content -LiteralPath $config -Encoding UTF8
          $dataDir = Join-Path $env:RUNNER_TEMP 'beta3-core-data'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $port = 18779
          $proc = Start-Process -FilePath .\mcp-core-beta3.exe -ArgumentList @(
            '--workspace', $workspace,
            '--host', '127.0.0.1',
            '--port', "$port",
            '--permission-mode', 'dangerous',
            '--tool-profile', 'full',
            '--file-scope', 'workspace',
            '--data-dir', $dataDir,
            '--enable-screen-capture',
            '--screen-vision-config', $config
          ) -PassThru -WindowStyle Hidden
          $client = [System.Net.Http.HttpClient]::new()
          try {
            $uri = "http://127.0.0.1:$port/mcp"
            $session = $null
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $initBody = @{
                  jsonrpc = '2.0'
                  id = 1
                  method = 'initialize'
                  params = @{
                    protocolVersion = '2025-06-18'
                    capabilities = @{}
                    clientInfo = @{ name = 'beta3-release-diagnose'; version = '1' }
                  }
                } | ConvertTo-Json -Depth 8 -Compress
                $content = [System.Net.Http.StringContent]::new($initBody, [System.Text.Encoding]::UTF8, 'application/json')
                $content.Headers.Remove('Content-Type') | Out-Null
                $content.Headers.TryAddWithoutValidation('Content-Type', 'application/json') | Out-Null
                $request = [System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Post, $uri)
                $request.Content = $content
                $request.Headers.TryAddWithoutValidation('Accept', 'application/json') | Out-Null
                $response = $client.SendAsync($request).GetAwaiter().GetResult()
                if ($response.IsSuccessStatusCode) {
                  $headerValues = [System.Collections.Generic.IEnumerable[string]]$null
                  if ($response.Headers.TryGetValues('Mcp-Session-Id', [ref]$headerValues)) {
                    $session = [string]($headerValues | Select-Object -First 1)
                    if ($session) { break }
                  }
                }
              } catch {
                # Core may still be starting.
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $session) { throw 'Published core did not initialize' }
            Write-Host "sessionLength=$($session.Length)"
            $headers = @{ Accept = 'application/json'; 'Mcp-Session-Id' = $session; 'MCP-Protocol-Version' = '2025-06-18' }

            $listBody = @{ jsonrpc = '2.0'; id = 2; method = 'tools/list'; params = @{} } | ConvertTo-Json -Compress
            $list = Invoke-RestMethod -Uri $uri -Method Post -ContentType 'application/json' -Headers $headers -Body $listBody
            $names = @($list.result.tools | ForEach-Object { $_.name } | Sort-Object)
            Write-Host "toolsListCount=$($names.Count)"
            $names | ForEach-Object { Write-Host "tool=$_" }

            $callBody = @{ jsonrpc = '2.0'; id = 3; method = 'tools/call'; params = @{ name = 'server_info'; arguments = @{} } } | ConvertTo-Json -Depth 8 -Compress
            $info = Invoke-RestMethod -Uri $uri -Method Post -ContentType 'application/json' -Headers $headers -Body $callBody
            $serverInfo = $info.result.structuredContent
            Write-Host "serverVersion=$($serverInfo.version)"
            Write-Host "serverToolCount=$($serverInfo.toolCount)"
            Write-Host "hasProbe=$($names -contains 'screen_capture_probe')"
            Write-Host "hasUIA=$($names -contains 'ui_automation_tree')"
            Write-Host "hasListSymbols=$($names -contains 'list_symbols')"
            if ($serverInfo.version -ne '0.13.0-beta.3') { throw "Unexpected version $($serverInfo.version)" }
            if ($names.Count -ne 55 -or [int]$serverInfo.toolCount -ne 55) { throw "Published core catalog count is not 55" }
            if ($names -notcontains 'screen_capture_probe' -or $names -notcontains 'ui_automation_tree') { throw 'Published core lost required Screen tools' }
            if ($names -contains 'list_symbols') { throw 'Published core still advertises list_symbols' }
          } finally {
            $client.Dispose()
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
