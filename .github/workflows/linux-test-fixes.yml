name: Correct Linux test fixtures
on:
  push:
    branches: [feature/linux-server]
    paths: [.github/workflows/linux-test-fixes.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/linux-server
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Correct test portability without dropping coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          targets = {
            'app/internal/updater/manager_test.go': 'TestCheckSelectsGitHubRelease',
            'app/internal/updater/stable_return_test.go': 'TestStableChannelAllowsPrereleaseReturn',
          }
          for filename, function in targets.items():
              p = Path(filename)
              s = p.read_text()
              if '\"runtime\"' not in s:
                  s = s.replace('import (\n', 'import (\n\t"runtime"\n', 1)
              if '\"strings\"' not in s:
                  s = s.replace('import (\n', 'import (\n\t"strings"\n', 1)
              start = s.index('func ' + function + '(')
              end = s.find('\nfunc ', start + 5)
              if end < 0:
                  end = len(s)
              segment = s[start:end]
              old = 'fmt.Fprint(w, `{'
              assert old in segment, filename
              segment = segment.replace(old, 'fmt.Fprint(w, strings.ReplaceAll(`{', 1)
              old = '        }`)'
              assert old in segment, filename
              segment = segment.replace(old, '        }`, "amd64", runtime.GOARCH))', 1)
              if function == 'TestCheckSelectsGitHubRelease':
                  old = 'release.AssetName != "MCP-DevDesk-Portable-amd64.zip"'
                  assert old in segment
                  segment = segment.replace(old, 'release.AssetName != "MCP-DevDesk-Portable-"+runtime.GOARCH+".zip"',1)
              p.write_text(s[:start]+segment+s[end:])
          p = Path('tools/smoke-linux.py')
          s = p.read_text()
          assert 'import http.cookiejar' in s and 'http.cookiejar.CookieJar()' in s
          s = s.replace('import http.cookiejar', 'from http.cookiejar import CookieJar', 1)
          s = s.replace('http.cookiejar.CookieJar()', 'CookieJar()')
          p.write_text(s)
          PY
          gofmt -w app/internal/updater/manager_test.go app/internal/updater/stable_return_test.go
          (cd app && go test -mod=vendor -count=1 ./internal/updater)
          python3 -c "import ast,pathlib; ast.parse(pathlib.Path('tools/smoke-linux.py').read_text())"
          git diff --check
          rm .github/workflows/linux-test-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/internal/updater/manager_test.go app/internal/updater/stable_return_test.go tools/smoke-linux.py .github/workflows/linux-test-fixes.yml
          git commit -m 'test(linux): make existing release fixtures architecture-aware and fix cookie import'
          git push origin HEAD:feature/linux-server
