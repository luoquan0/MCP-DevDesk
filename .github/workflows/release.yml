name: Release MCP DevDesk

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - "patch"
          - "minor"
          - "major"
  push:
    tags:
      - "v*"
    branches:
      - "main"

permissions:
  contents: write

jobs:
  release-windows-amd64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare release version
        shell: pwsh
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          $versionPath = "app\internal\buildinfo\version.go"
          $versionGitPath = "app/internal/buildinfo/version.go"
          $readmePath = "README.md"

          function Read-Version([string]$text) {
            $match = [regex]::Match($text, 'const Version = "([^"]+)"')
            if (-not $match.Success) {
              throw "Could not resolve version from app/internal/buildinfo/version.go"
            }
            return $match.Groups[1].Value
          }

          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $releaseTag = $env:GITHUB_REF_NAME
            $releaseVersion = $releaseTag.TrimStart("v")
            $sourceVersion = Read-Version (Get-Content -LiteralPath $versionPath -Raw)
            if ($sourceVersion -ne $releaseVersion) {
              throw "Tag $releaseTag does not match source version $sourceVersion"
            }
            $releaseSha = $env:GITHUB_SHA
          } else {
            $triggerVersionText = git show "$($env:GITHUB_SHA):$versionGitPath"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not read the version from trigger commit $env:GITHUB_SHA"
            }
            $triggerVersion = Read-Version ($triggerVersionText -join "`n")
            $parts = @($triggerVersion.Split(".") | ForEach-Object { [int]$_ })
            if ($parts.Count -ne 3) {
              throw "Version $triggerVersion is not a three-part semantic version"
            }

            $bump = $env:RELEASE_BUMP
            if ([string]::IsNullOrWhiteSpace($bump)) {
              $bump = "patch"
            }
            switch ($bump) {
              "major" { $parts[0]++; $parts[1] = 0; $parts[2] = 0 }
              "minor" { $parts[1]++; $parts[2] = 0 }
              "patch" { $parts[2]++ }
              default { throw "Unsupported release bump: $bump" }
            }

            $releaseVersion = "$($parts[0]).$($parts[1]).$($parts[2])"
            $releaseTag = "v$releaseVersion"

            git fetch origin main --tags

            $existingTag = git rev-parse -q --verify "refs/tags/$releaseTag^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0 -and $existingTag) {
              git checkout --detach $existingTag
              $releaseSha = (git rev-parse HEAD).Trim()
            } else {
              $bumpSubject = "chore: bump version to $releaseTag [skip release]"
              $existingBump = git log origin/main --format="%H" --fixed-strings --grep="$bumpSubject" -1
              if ($existingBump) {
                $existingBump = $existingBump.Trim()
              }
              if ($existingBump) {
                git checkout --detach $existingBump
                $releaseSha = (git rev-parse HEAD).Trim()
              } else {
                git checkout -B main origin/main
                $mainVersion = Read-Version (Get-Content -LiteralPath $versionPath -Raw)
                if ($mainVersion -ne $triggerVersion) {
                  throw "main moved from version $triggerVersion to $mainVersion before release preparation; start a new release from current main"
                }

                $versionContent = Get-Content -LiteralPath $versionPath -Raw
                $versionContent = $versionContent -replace 'const Version = "[^"]+"', "const Version = `"$releaseVersion`""
                Set-Content -LiteralPath $versionPath -Value $versionContent -Encoding utf8 -NoNewline

                if (Test-Path -LiteralPath $readmePath) {
                  $readme = Get-Content -LiteralPath $readmePath -Raw -Encoding utf8
                  $readme = $readme -replace '当前版本 `\d+\.\d+\.\d+` 已完成：', "当前版本 ``$releaseVersion`` 已完成："
                  Set-Content -LiteralPath $readmePath -Value $readme -Encoding utf8 -NoNewline
                }

                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add -- $versionPath $readmePath
                git commit -m "$bumpSubject"
                git push origin HEAD:main
                $releaseSha = (git rev-parse HEAD).Trim()
              }
            }
          }
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_SHA=$releaseSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci

      - name: Guard public release secrets
        shell: pwsh
        run: .\tools\check-public-release.ps1

      - name: Stage pinned cloudflared runtime
        shell: pwsh
        run: |
          $pinPath = "tools\cloudflared-release.json"
          $pin = Get-Content -LiteralPath $pinPath -Raw -Encoding utf8 | ConvertFrom-Json
          $version = [string]$pin.version
          $asset = [string]$pin.asset
          $expected = ([string]$pin.sha256).ToLowerInvariant()
          if ($version -notmatch '^\d{4}\.\d+\.\d+$') {
            throw "Invalid cloudflared version in $pinPath: $version"
          }
          if ($asset -ne "cloudflared-windows-amd64.exe") {
            throw "Unexpected cloudflared release asset in $pinPath: $asset"
          }
          if ($expected -notmatch '^[0-9a-f]{64}$') {
            throw "Invalid cloudflared SHA256 in $pinPath"
          }
          $url = "https://github.com/cloudflare/cloudflared/releases/download/$version/$asset"
          $temp = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri $url -OutFile $temp -UseBasicParsing
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $temp).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "cloudflared SHA256 mismatch: expected $expected, got $actual"
          }
          Copy-Item -LiteralPath $temp -Destination ".\cloudflared.exe" -Force
          $versionOutput = (& .\cloudflared.exe --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch [regex]::Escape($version)) {
            throw "Bundled cloudflared version check failed: $versionOutput"
          }
          Write-Host "Bundling $versionOutput"

      - name: Build and test
        shell: pwsh
        env:
          MCP_DEVDESK_GITHUB_REPOSITORY: ${{ github.repository }}
        run: .\build.ps1 -Arch amd64 -RunTests

      - name: Create SHA256 files
        shell: pwsh
        run: |
          $assets = @(
            "dist\MCP-DevDesk-amd64.exe",
            "dist\MCP-DevDesk-Portable-amd64.zip",
            "dist\devdesk-updater-amd64.exe",
            "dist\devdeskctl-amd64.exe",
            "dist\mcp-core-amd64.exe"
          )
          foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $asset
            Set-Content -LiteralPath ($asset + ".sha256") -Value ($hash + "  " + $name) -Encoding ASCII
          }

      - name: Point release tag at this build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git tag -f "$env:RELEASE_TAG" "$env:RELEASE_SHA"
          git push origin "refs/tags/$env:RELEASE_TAG" --force

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "dist\MCP-DevDesk-amd64.exe",
            "dist\MCP-DevDesk-amd64.exe.sha256",
            "dist\MCP-DevDesk-Portable-amd64.zip",
            "dist\MCP-DevDesk-Portable-amd64.zip.sha256",
            "dist\devdesk-updater-amd64.exe",
            "dist\devdesk-updater-amd64.exe.sha256",
            "dist\devdeskctl-amd64.exe",
            "dist\devdeskctl-amd64.exe.sha256",
            "dist\mcp-core-amd64.exe",
            "dist\mcp-core-amd64.exe.sha256"
          )
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" $assets --clobber
            gh release edit "$env:RELEASE_TAG" --title "MCP DevDesk $env:RELEASE_TAG" --latest
          } else {
            gh release create "$env:RELEASE_TAG" $assets `
              --title "MCP DevDesk $env:RELEASE_TAG" `
              --generate-notes `
              --verify-tag
          }
