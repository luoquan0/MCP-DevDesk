name: Apply Agent Runtime Patch

on:
  push:
    branches:
      - "feature/agent-runtime-v1"
    paths:
      - ".github/agent-runtime-patch-*.b64"
      - ".github/workflows/apply-agent-runtime-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'bootstrap agent runtime patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply agent runtime patch without self-modifying workflows
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-runtime-patch-{1,2,3,4,5,6}.b64 | base64 -d | gzip -d > "$RUNNER_TEMP/agent-runtime.patch"
          git apply --check "$RUNNER_TEMP/agent-runtime.patch"
          git apply "$RUNNER_TEMP/agent-runtime.patch"

          # GitHub's workflow token may not create/update workflow files. Keep
          # workflow changes out of this commit; the GitHub connector writes
          # the validated workflow in a separate authenticated commit.
          git checkout HEAD -- .github/workflows/agent-dev-snapshot.yml
          rm -f .github/workflows/agent-runtime-beta.yml
          rm -f .github/agent-runtime-patch-{1,2,3,4,5,6}.b64

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "Refusing unexpected workflow mutation"
            git diff --cached --name-only
            exit 1
          fi
          git diff --cached --check
          git commit -m "feat: add agent runtime beta"
          git push origin HEAD:feature/agent-runtime-v1
