name: Apply DNS repair patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/apply_dns_repair_patch.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Apply patch
        run: python3 .github/scripts/apply_dns_repair_patch.py

      - name: Format Go files
        run: gofmt -w app/internal/tunnel/cloudflare.go app/internal/tunnel/cloudflare_test.go app/internal/application/instances.go app/internal/web/server.go

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/internal/tunnel/cloudflare.go app/internal/tunnel/cloudflare_test.go app/internal/application/instances.go app/internal/web/server.go frontend/src/stores/app.ts frontend/src/pages/InstancesPage.vue
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: verify and repair Cloudflare Tunnel DNS"
          git push origin HEAD:main
