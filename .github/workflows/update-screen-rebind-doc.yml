name: Update Screen Vision Rebind Docs

on:
  push:
    branches:
      - "fix/screen-vision-rebind-stable"

permissions:
  contents: write

jobs:
  update-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Update documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/SCREEN_VISION.md')
          text = path.read_text(encoding='utf-8')
          old = '读取最小化/托盘目标时，会使用 `ShowWindowAsync(SW_SHOWNOACTIVATE)` 尝试无焦点恢复；若恢复后仍停留在异常小尺寸，则按正常窗口位置修复尺寸，等待重新渲染后走目标安全捕获链，并最终恢复原来的最小化/隐藏状态和用户前台窗口。'
          new = '读取最小化/托盘目标时，会使用 `ShowWindowAsync(SW_SHOWNOACTIVATE)` 尝试无焦点恢复；恢复动作之后会重新 `EnumWindows`，按原 PID + 进程名重新绑定真正的主 HWND，并再次应用 Owner、`WS_EX_TOOLWINDOW`、DWM Cloaked 和正常尺寸筛选。如果出现多个不能唯一判断的主窗口会直接失败，不会猜测目标。找到唯一窗口后，DevDesk 会轮询窗口矩形，要求位置和尺寸连续多次稳定，并在 `DwmFlush` 后再次确认稳定才截图，而不是只依赖固定延迟；最后恢复原来的最小化/隐藏状态和用户前台窗口。'
          if old not in text:
              raise SystemExit('documentation target paragraph not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SCREEN_VISION.md
          git commit -m "docs: document Screen Vision HWND rebind stability"
          git push origin HEAD:${{ github.ref_name }}
