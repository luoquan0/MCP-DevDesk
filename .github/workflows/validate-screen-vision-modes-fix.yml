name: Validate Screen Vision Modes Fix

on:
  push:
    branches:
      - "feature/screen-vision-modes-stable-return"

permissions:
  contents: write

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/screen-vision-modes-stable-return
          fetch-depth: 0

      - name: Apply implementation patch
        shell: pwsh
        run: |
          python .\tools\prepare-screen-vision-patch.py
          python .\tools\apply-screen-vision-modes-fix.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Format Go changes
        shell: pwsh
        run: |
          $files = @(
            "app\internal\model\types.go",
            "app\internal\config\store.go",
            "app\internal\config\screen_vision_settings_test.go",
            "app\internal\application\app.go",
            "app\internal\mcpcore\screen_tools.go",
            "app\internal\mcpcore\screen_policy.go",
            "app\internal\mcpcore\screen_policy_test.go",
            "app\internal\mcpcore\screen_public.go",
            "app\cmd\mcp-core\main.go",
            "app\cmd\mcp-core\screen_vision_config_test.go",
            "app\internal\updater\manager.go",
            "app\internal\updater\stable_return_test.go"
          )
          gofmt -w $files
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci

      - name: Full Windows build and tests
        shell: pwsh
        run: .\build.ps1 -Arch amd64 -RunTests

      - name: Commit validated implementation
        shell: pwsh
        run: |
          Remove-Item -LiteralPath ".github\workflows\validate-screen-vision-modes-fix.yml" -Force
          Remove-Item -LiteralPath "tools\apply-screen-vision-modes-fix.py" -Force
          Remove-Item -LiteralPath "tools\prepare-screen-vision-patch.py" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add selectable Screen Vision modes and stable return"
          git push origin HEAD:feature/screen-vision-modes-stable-return
