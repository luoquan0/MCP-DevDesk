name: Apply proxy notice

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/apply_proxy_notice.py
      - .github/workflows/apply-proxy-notice.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/apply_proxy_notice.py
      - name: Remove one-shot patch files
        run: |
          rm .github/scripts/apply_proxy_notice.py
          rm .github/workflows/apply-proxy-notice.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/stores/app.ts frontend/src/pages/SettingsPage.vue .github/scripts/apply_proxy_notice.py .github/workflows/apply-proxy-notice.yml
          git commit -m "fix: show proxy mode confirmation"
          git push
