name: MCP DevDesk v0.13 Beta 4 Fix

on:
  push:
    branches:
      - "fix/v0.13.0-beta4-runtime"
    paths:
      - "tools/v013_beta4_fix.py"
      - ".github/workflows/v013-beta4-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-persist:
    runs-on: windows-latest
    steps:
      - name: Checkout Beta 4 fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v0.13.0-beta4-runtime
          fetch-depth: 0

      - name: Apply Beta 4 migration
        shell: pwsh
        run: python tools/v013_beta4_fix.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Format and diff check
        shell: pwsh
        run: |
          gofmt -w app\internal\mcpcore\screen_policy.go
          gofmt -w app\internal\mcpcore\screen_policy_test.go
          gofmt -w app\internal\mcpcore\ui_automation_windows.go
          gofmt -w app\internal\mcpcore\ui_automation_windows_test.go
          gofmt -w app\internal\buildinfo\version.go
          git diff --check

      - name: Beta 4 targeted tests
        shell: pwsh
        run: |
          Set-Location app
          go test -mod=vendor ./internal/mcpcore -run 'TestConfigureScreenVisionFiltersToolsByMode|TestSpecifiedWindowModeWithoutTargetDoesNotAdvertiseCapture|TestDesktopModeAllowsWindowInspection|TestUIAutomationPowerShellCollectionPayloadIsJSONSafe|TestUIAutomationPowerShellHelpersHandleScalarValues' -count=1

      - name: Go full tests
        shell: pwsh
        run: |
          Set-Location app
          go test -mod=vendor ./... -count=1

      - name: Build real Beta 4 core
        shell: pwsh
        run: |
          Set-Location app
          go build -mod=vendor -trimpath -o ..\dist\beta4-core-smoke.exe .\cmd\mcp-core

      - name: Real mcp-core policy catalog smoke
        shell: pwsh
        run: .\tools\smoke-mcp-core-catalog.ps1 -CorePath .\dist\beta4-core-smoke.exe

      - name: Version and documentation consistency
        shell: pwsh
        run: |
          $versionText = Get-Content app\internal\buildinfo\version.go -Raw
          if (-not $versionText.Contains('0.13.0-beta.4')) { throw 'buildinfo version was not upgraded to beta.4' }
          $preview = Get-Content docs\V013_PREVIEW.md -Raw
          $roadmap = Get-Content docs\ROADMAP.md -Raw
          if (-not $preview.Contains('0.13.0-beta.4')) { throw 'preview docs missing beta.4' }
          if (-not $roadmap.Contains('0.13.0-beta.4')) { throw 'roadmap missing beta.4' }
          if (-not $preview.Contains('active 52')) { throw 'preview docs missing mode-aware catalog contract' }

      - name: Persist validated Beta 4 product source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github\workflows\v013-preview.yml
          git add app\internal\mcpcore\screen_policy.go app\internal\mcpcore\screen_policy_test.go app\internal\mcpcore\ui_automation_windows.go app\internal\mcpcore\ui_automation_windows_test.go app\internal\buildinfo\version.go docs\V013_PREVIEW.md docs\ROADMAP.md tools\smoke-mcp-core-catalog.ps1
          git diff --cached --check
          git commit -m "fix: beta4 runtime screen catalog and UI automation"
          git push origin HEAD:fix/v0.13.0-beta4-runtime
