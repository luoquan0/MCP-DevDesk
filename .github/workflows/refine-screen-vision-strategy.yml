name: Refine Screen Vision Strategy

on:
  push:
    branches:
      - "fix/screen-vision-default-strategy"

permissions:
  contents: write

jobs:
  refine-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[strategy-refined]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/screen-vision-default-strategy
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Refine strategy delivery
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace_once(
              'app/internal/mcpcore/server.go',
              '''func (s *Server) instructionsForToolSession(sessionID string) string {
          \tif sessionID == "" || (s.currentManagedInstructions() == "" && len(s.currentProjectRules()) == 0) {
          \t\treturn ""
          \t}
          ''',
              '''func (s *Server) instructionsForToolSession(sessionID string) string {
          \tif sessionID == "" || (s.screenVisionDefaultInstructions() == "" && s.currentManagedInstructions() == "" && len(s.currentProjectRules()) == 0) {
          \t\treturn ""
          \t}
          ''')

          replace_once(
              'app/internal/mcpcore/screen_policy.go',
              '''// ConfigureScreenVision narrows the advertised and callable Screen Vision tools
          // to the mode explicitly selected in MCP DevDesk. It is called once during Go
          // MCP Core startup, before the HTTP server begins serving requests.

          func (s *Server) screenVisionDefaultInstructions() string {''',
              '''// screenVisionDefaultInstructions tells MCP clients when direct GUI capture
          // should be the default source of truth, without widening the selected privacy mode.
          func (s *Server) screenVisionDefaultInstructions() string {''')

          replace_once(
              'app/internal/mcpcore/screen_policy.go',
              '''\tswitch policy.mode {
          \tcase "desktop":''',
              '''\tif policy.mode == "window" && policy.windowID == "" {
          \t\treturn ""
          \t}
          \tswitch policy.mode {
          \tcase "desktop":''')

          replace_once(
              'app/internal/mcpcore/screen_policy.go',
              '''}

          func (s *Server) ConfigureScreenVision(mode, windowID string, windowProcessID uint32) {''',
              '''}

          // ConfigureScreenVision narrows the advertised and callable Screen Vision tools
          // to the mode explicitly selected in MCP DevDesk. It is called once during Go
          // MCP Core startup, before the HTTP server begins serving requests.
          func (s *Server) ConfigureScreenVision(mode, windowID string, windowProcessID uint32) {''')

          tests = Path('app/internal/mcpcore/screen_default_strategy_test.go')
          text = tests.read_text(encoding='utf-8')
          anchor = '''func TestScreenToolDescriptionsPreferDirectGUIInspection(t *testing.T) {'''
          extra = '''func TestSpecifiedWindowDefaultInstructionsRequireTarget(t *testing.T) {
          \tserver, err := New(Options{Workspace: t.TempDir(), PermissionMode: "trusted", ScreenCaptureEnabled: true})
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tdefer server.Close()
          \tserver.ConfigureScreenVision("window", "", 0)
          \tif instructions := server.initializeInstructions(); strings.Contains(instructions, "default desktop visual inspection policy") {
          \t\tt.Fatalf("specified-window mode without a target must not recommend unavailable capture tools:\\n%s", instructions)
          \t}
          }

          '''
          if 'func TestSpecifiedWindowDefaultInstructionsRequireTarget' not in text:
              if anchor not in text:
                  raise SystemExit('test insertion anchor not found')
              tests.write_text(text.replace(anchor, extra + anchor, 1), encoding='utf-8', newline='\n')
          '@ | Set-Content -LiteralPath refine_strategy.py -Encoding utf8
          python refine_strategy.py
          Remove-Item refine_strategy.py -Force
          gofmt -w app/internal/mcpcore/server.go app/internal/mcpcore/screen_policy.go app/internal/mcpcore/screen_default_strategy_test.go

      - name: Targeted tests
        shell: pwsh
        run: |
          Set-Location app
          go test ./internal/mcpcore -run 'TestScreenVisionDefaultInstructions|TestScreenToolDescriptionsPreferDirectGUIInspection|TestSpecifiedWindowDefaultInstructionsRequireTarget|TestConfigureScreenVision|TestSpecifiedWindowMode|TestDesktopModeAllowsWindowInspection|TestManagedInstructionsAreDeliveredOnFirstToolCallPerSession' -count=1

      - name: Commit refinement
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/internal/mcpcore/server.go app/internal/mcpcore/screen_policy.go app/internal/mcpcore/screen_default_strategy_test.go
          git diff --cached --quiet && throw "refinement produced no changes"
          git commit -m "fix: deliver Screen Vision strategy on first tool call [strategy-refined] [skip release]"
          git push origin HEAD:fix/screen-vision-default-strategy
