name: MCP DevDesk v0.13 Beta 6 Validation

on:
  push:
    branches:
      - fix/v0.13.0-beta6-kill-probe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-persist:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.13.0-beta6-kill-probe
          fetch-depth: 0

      - name: Apply Beta 6 source migration
        shell: pwsh
        run: |
          python tools/v013_beta6_fix.py
          python tools/v013_beta6_fix2.py

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Format and diff check
        shell: pwsh
        run: |
          gofmt -w app/internal/mcpcore/command_platform_windows.go app/internal/mcpcore/command_platform_windows_test.go app/internal/mcpcore/command_tools.go app/internal/mcpcore/screen_tools.go app/internal/mcpcore/compatibility_tools.go app/internal/mcpcore/beta6_compatibility_test.go app/cmd/mcp-core/main.go app/internal/buildinfo/version.go
          git diff --check

      - name: Targeted Beta 6 regressions
        shell: pwsh
        run: |
          Set-Location app
          go test -mod=vendor ./internal/mcpcore -run 'TestTerminateCommandIsIdempotentAfterWait|TestCheckExecEnvironmentIncludesScreenProbeCompatibility' -count=1

      - name: Full Go tests
        shell: pwsh
        run: |
          Set-Location app
          go test -mod=vendor ./... -count=1

      - name: Full Windows build and regression tests
        shell: pwsh
        run: .\build.ps1 -Arch amd64 -RunTests

      - name: Built core catalog and kill-session contract
        shell: pwsh
        run: .\tools\smoke-mcp-core-catalog.ps1 -CorePath .\dist\mcp-core-amd64.exe

      - name: Version and docs consistency
        shell: pwsh
        run: |
          $versionText = Get-Content app\internal\buildinfo\version.go -Raw
          if (-not $versionText.Contains('0.13.0-beta.6')) { throw 'build version is not beta.6' }
          $roadmap = Get-Content docs\ROADMAP.md -Raw
          $preview = Get-Content docs\V013_PREVIEW.md -Raw
          if (-not $roadmap.Contains('0.13.0-beta.6')) { throw 'ROADMAP missing beta.6' }
          if (-not $preview.Contains('0.13.0-beta.6')) { throw 'preview notes missing beta.6' }
          if (-not $preview.Contains('check_exec_environment')) { throw 'probe compatibility tool docs missing' }
          if (-not $preview.Contains('screenCaptureProbe')) { throw 'probe compatibility payload docs missing' }

      - name: Persist validated product changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cmd/mcp-core/main.go app/internal/buildinfo/version.go app/internal/mcpcore/command_platform_windows.go app/internal/mcpcore/command_platform_windows_test.go app/internal/mcpcore/command_tools.go app/internal/mcpcore/screen_tools.go app/internal/mcpcore/compatibility_tools.go app/internal/mcpcore/beta6_compatibility_test.go docs/ROADMAP.md docs/V013_PREVIEW.md tools/smoke-mcp-core-catalog.ps1
          git diff --cached --check
          if (git diff --cached --quiet) {
            Write-Host 'No product changes to persist.'
            exit 0
          }
          git commit -m "fix: beta6 make kill idempotent and expose probe fallback"
          git push origin HEAD:fix/v0.13.0-beta6-kill-probe
