name: Cleanup retired 0.12.35 betas

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/cleanup-0.12.35-betas.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'cleanup retired 0.12.35 betas')
    runs-on: ubuntu-latest
    steps:
      - name: Delete retired prereleases, tags and beta branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releasePattern = /^v?0\.12\.35-beta\.\d+$/;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            for (const release of releases.filter((item) => releasePattern.test(item.tag_name))) {
              core.info(`Deleting release ${release.tag_name} (${release.id})`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
            }

            const tags = [
              '0.12.35-beta.1',
              '0.12.35-beta.2',
              '0.12.35-beta.3',
              '0.12.35-beta.4',
              '0.12.35-beta.5',
              'v0.12.35-beta.1',
              'v0.12.35-beta.2',
              'v0.12.35-beta.3',
              'v0.12.35-beta.4',
              'v0.12.35-beta.5',
            ];
            for (const tag of tags) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
                core.info(`Deleted tag ${tag}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const branches = [
              'build/screen-vision-0.12.35-beta.1',
              'build/screen-vision-0.12.35-beta.2',
              'release/screen-vision-0.12.35-beta.5',
              'fix/screen-vision-background-capture',
              'fix/screen-vision-global-policy-beta4',
              'fix/screen-vision-window-desktop-beta3',
              'ops/republish-screen-vision-beta-semver',
              'feature/screen-vision-prerelease',
            ];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                core.info(`Deleted branch ${branch}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
