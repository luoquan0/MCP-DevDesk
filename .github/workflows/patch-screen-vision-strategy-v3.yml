name: Patch Screen Vision Strategy V3

on:
  push:
    branches:
      - "fix/screen-vision-default-strategy"

permissions:
  contents: write

jobs:
  patch-targeted-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[screen-strategy-patched]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/screen-vision-default-strategy
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Apply strategy patch from validated patch script
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          source = Path('.github/workflows/patch-screen-vision-strategy-v2.yml').read_text(encoding='utf-8')
          start_marker = "          @'\n"
          end_marker = "          '@ | Set-Content -LiteralPath patch_strategy.py -Encoding utf8"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('patch_strategy.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          '@ | Set-Content -LiteralPath extract_patch.py -Encoding utf8
          python extract_patch.py
          python patch_strategy.py
          Remove-Item extract_patch.py, patch_strategy.py -Force
          gofmt -w app/internal/mcpcore/server.go app/internal/mcpcore/screen_policy.go app/internal/mcpcore/screen_tools.go app/internal/mcpcore/screen_default_strategy_test.go

      - name: Targeted Screen Vision tests
        shell: pwsh
        run: |
          Set-Location app
          go test ./internal/mcpcore -run 'TestScreenVisionDefaultInstructions|TestScreenToolDescriptionsPreferDirectGUIInspection|TestConfigureScreenVision|TestSpecifiedWindowMode|TestDesktopModeAllowsWindowInspection' -count=1

      - name: Commit validated patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/internal/mcpcore/server.go app/internal/mcpcore/screen_policy.go app/internal/mcpcore/screen_tools.go app/internal/mcpcore/screen_default_strategy_test.go docs/SCREEN_VISION.md
          git diff --cached --quiet && throw "strategy patch produced no source changes"
          git commit -m "fix: make Screen Vision the default GUI inspection strategy [screen-strategy-patched] [skip release]"
          git push origin HEAD:fix/screen-vision-default-strategy
