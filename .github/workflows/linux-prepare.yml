name: Prepare Linux platform wiring
on:
  push:
    branches: [feature/linux-server]
    paths: [.github/workflows/linux-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/linux-server
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Apply platform wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise RuntimeError('missing patch marker: ' + path)
              p.write_text(s.replace(old, new, 1))
          for path in [
              'app/internal/secrets/protect_other.go',
              'app/internal/process/platform_other.go',
              'app/internal/process/port_owner_other.go',
              'app/internal/process/tunnel_process_other.go',
              'app/internal/mcpcore/command_platform_other.go',
          ]:
              replace(path, '//go:build !windows', '//go:build !windows && !linux')
          p = Path('app/internal/process/manager.go')
          s = p.read_text()
          start = s.index('\tkill := exec.Command("taskkill.exe"')
          end = s.index('\n\treturn nil\n}', start)
          old = s[start:end]
          helper = '''//go:build !linux

          package process

          import (
              "fmt"
              "os/exec"
              "strconv"
              "strings"
          )

          // Retain the existing Windows stop implementation unchanged.
          func stopManagedCommand(cmd *exec.Cmd) error {
              kill := exec.Command("taskkill.exe", "/PID", strconv.Itoa(cmd.Process.Pid), "/T", "/F")
              configureChildProcess(kill, true)
              if output, err := kill.CombinedOutput(); err != nil {
                  text := strings.ToLower(string(output))
                  if !strings.Contains(text, "not found") && !strings.Contains(text, "no running instance") {
                      return fmt.Errorf("stop PID %d: %w: %s", cmd.Process.Pid, err, strings.TrimSpace(string(output)))
                  }
              }
              return nil
          }
          '''
          Path('app/internal/process/stop_nonlinux.go').write_text(helper)
          s = s[:start] + '''\tif err := stopManagedCommand(cmd); err != nil {
              target.mu.Lock()
              if target.cmd == cmd { target.stopping = false }
              target.mu.Unlock()
              return err
          }''' + s[end:]
          p.write_text(s)
          replace('app/internal/process/tunnel_process.go',
              'args := splitWindowsCommandLine(commandLine)\n\tresult :=',
              'return parseCloudflaredArguments(splitWindowsCommandLine(commandLine))\n}\n\nfunc parseCloudflaredArguments(args []string) model.TunnelProcess {\n\tresult :=')
          p = Path('app/internal/buildinfo/version.go')
          original = p.read_text()
          p.write_text('//go:build !linux\n\n' + original)
          Path('app/internal/buildinfo/version_linux.go').write_text('//go:build linux\n\n' + original.replace('"0.12.37"', '"0.12.38-linux.1"'))
          # Linux has its own lifecycle; never download/install Windows update packages.
          p = Path('app/internal/application/app.go')
          s = p.read_text()
          marker = 'func (a *App) PrepareUpdate(ctx context.Context) (appupdater.PreparedUpdate, error) {'
          assert marker in s
          s = s.replace(marker, marker + '\n\tif runtime.GOOS == "linux" { return appupdater.PreparedUpdate{}, errors.New("Linux preview: stop the service and replace program files from the Linux tar.gz; preserve data, workspace and cloudflared") }', 1)
          marker = 'func (a *App) LaunchPreparedUpdate(prepared appupdater.PreparedUpdate) error {'
          assert marker in s
          s = s.replace(marker, marker + '\n\tif runtime.GOOS == "linux" { return errors.New("Windows updater cannot be launched on Linux") }', 1)
          p.write_text(s)
          # Cloudflare's Linux download is executable without an .exe suffix.
          p = Path('app/internal/application/cloudflare_manage.go')
          s = p.read_text()
          marker = 'func cloudflaredAssetName() (string, error) {'
          assert marker in s
          s = s.replace(marker, marker + '\n    if runtime.GOOS == "linux" && (runtime.GOARCH == "amd64" || runtime.GOARCH == "arm64") { return "cloudflared-linux-" + runtime.GOARCH, nil }', 1)
          marker = 'tempPath := temp.Name()'
          assert marker in s
          s = s.replace(marker, marker + '\n    if runtime.GOOS == "linux" { if err := temp.Chmod(0700); err != nil { temp.Close(); os.Remove(temp.Name()); return CloudflaredUpdateResult{}, err } }', 1)
          p.write_text(s)
          PY
          gofmt -w app/cmd/mcp-devdesk-server/main_linux.go app/internal/secrets/protect_linux.go app/internal/process/platform_linux.go app/internal/process/manager.go app/internal/process/stop_nonlinux.go app/internal/process/tunnel_process.go app/internal/mcpcore/command_platform_linux.go app/internal/buildinfo/version_linux.go app/internal/buildinfo/version.go
          git diff --check
          rm .github/workflows/linux-prepare.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app .github/workflows/linux-prepare.yml
          git commit -m 'feat(linux): wire native platform implementations without changing Windows release'
          git push origin HEAD:feature/linux-server
