name: Apply logs dropdown and update save dedupe

on:
  push:
    branches:
      - main
    paths:
      - "tools/.apply_logs_dropdown_and_update_save_dedupe"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply source patch
        shell: pwsh
        run: python tools/apply_logs_dropdown_and_update_save_dedupe.py

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci --prefix frontend

      - name: Build frontend
        shell: pwsh
        run: npm run build --prefix frontend

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          git diff -- frontend/src/pages/SettingsPage.vue frontend/src/pages/LogsPage.vue DESIGN.md

      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/SettingsPage.vue frontend/src/pages/LogsPage.vue DESIGN.md
          git diff --cached --check
          git commit -m "fix: dedupe update saves and compact logs UI"
          git push
