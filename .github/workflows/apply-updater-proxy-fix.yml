name: Apply updater proxy fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/apply_updater_proxy_fix.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply_updater_proxy_fix.py

      - name: Format Go
        run: gofmt -w app/internal/updater/manager.go app/internal/updater/proxy.go app/internal/updater/proxy_test.go

      - name: Verify changed files
        run: git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/internal/updater/manager.go app/internal/updater/proxy.go app/internal/updater/proxy_test.go frontend/src/types/api.ts frontend/src/stores/app.ts frontend/src/pages/SettingsPage.vue docs/RELEASE.md
          git commit -m "fix: add update proxy support [release]"
          git push origin HEAD:main
