name: Apply updater proxy fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-updater-proxy-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply updater proxy changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          manager = "app/internal/updater/manager.go"
          replace_once(manager,
          '''type Settings struct {
          \tRepository     string            `json:"repository"`
          \tChannel        string            `json:"channel"`
          \tCheckOnStartup bool              `json:"checkOnStartup"`
          \tProgress       *DownloadProgress `json:"progress,omitempty"`
          }

          type SettingsUpdate struct {
          \tRepository     *string `json:"repository"`
          \tChannel        *string `json:"channel"`
          \tCheckOnStartup *bool   `json:"checkOnStartup"`
          }
          ''',
          '''type Settings struct {
          \tRepository     string            `json:"repository"`
          \tChannel        string            `json:"channel"`
          \tCheckOnStartup bool              `json:"checkOnStartup"`
          \tProxyHost      string            `json:"proxyHost"`
          \tProxyPort      int               `json:"proxyPort"`
          \tProgress       *DownloadProgress `json:"progress,omitempty"`
          }

          type SettingsUpdate struct {
          \tRepository     *string `json:"repository"`
          \tChannel        *string `json:"channel"`
          \tCheckOnStartup *bool   `json:"checkOnStartup"`
          \tProxyHost      *string `json:"proxyHost"`
          \tProxyPort      *int    `json:"proxyPort"`
          }
          ''')

          replace_once(manager,
          '''\tm.normalizeLocked()
          \tif m.current.Repository == "" && len(defaultRepository) > 0 {
          \t\tcandidate := strings.TrimSpace(defaultRepository[0])
          \t\tif repositoryPattern.MatchString(candidate) {
          \t\t\tm.current.Repository = candidate
          \t\t}
          \t}
          \tif err := validateSettings(m.current); err != nil {
          \t\treturn nil, err
          \t}
          \treturn m, nil
          ''',
          '''\tm.normalizeLocked()
          \tif len(defaultRepository) > 0 {
          \t\tcandidate := strings.TrimSpace(defaultRepository[0])
          \t\tif repositoryPattern.MatchString(candidate) {
          \t\t\t// Release builds own their update source. This also migrates any
          \t\t\t// repository value saved by older versions back to the built-in repo.
          \t\t\tm.current.Repository = candidate
          \t\t}
          \t}
          \tif err := validateSettings(m.current); err != nil {
          \t\treturn nil, err
          \t}
          \tm.client = newHTTPClient(m.current)
          \treturn m, nil
          ''')

          replace_once(manager,
          '''\tif update.CheckOnStartup != nil {
          \t\tnext.CheckOnStartup = *update.CheckOnStartup
          \t}
          \tif err := validateSettings(next); err != nil {
          ''',
          '''\tif update.CheckOnStartup != nil {
          \t\tnext.CheckOnStartup = *update.CheckOnStartup
          \t}
          \tif update.ProxyHost != nil {
          \t\tnext.ProxyHost = strings.TrimSpace(*update.ProxyHost)
          \t}
          \tif update.ProxyPort != nil {
          \t\tnext.ProxyPort = *update.ProxyPort
          \t}
          \tif err := validateSettings(next); err != nil {
          ''')

          replace_once(manager,
          '''\tif err := m.saveLocked(); err != nil {
          \t\tm.current = previous
          \t\treturn Settings{}, err
          \t}
          \treturn m.current, nil
          }
          ''',
          '''\tif err := m.saveLocked(); err != nil {
          \t\tm.current = previous
          \t\treturn Settings{}, err
          \t}
          \tm.client = newHTTPClient(m.current)
          \treturn m.current, nil
          }
          ''')

          p = Path(manager)
          text = p.read_text(encoding="utf-8")
          if text.count("m.client.Do(req)") != 3:
              raise SystemExit(f"expected 3 updater client calls, found {text.count('m.client.Do(req)')}")
          text = text.replace("m.client.Do(req)", "m.httpClient().Do(req)")
          p.write_text(text, encoding="utf-8")

          replace_once(manager,
          '''func (m *Manager) normalizeLocked() {
          \tm.current.Repository = strings.TrimSpace(m.current.Repository)
          \tm.current.Channel = strings.ToLower(strings.TrimSpace(m.current.Channel))
          \tm.current.Progress = nil
          ''',
          '''func (m *Manager) normalizeLocked() {
          \tm.current.Repository = strings.TrimSpace(m.current.Repository)
          \tm.current.Channel = strings.ToLower(strings.TrimSpace(m.current.Channel))
          \tm.current.ProxyHost = strings.TrimSpace(m.current.ProxyHost)
          \tm.current.Progress = nil
          ''')

          replace_once(manager,
          '''\tswitch settings.Channel {
          \tcase "stable", "prerelease":
          \tdefault:
          \t\treturn errors.New("update channel must be stable or prerelease")
          \t}
          \treturn nil
          }
          ''',
          '''\tswitch settings.Channel {
          \tcase "stable", "prerelease":
          \tdefault:
          \t\treturn errors.New("update channel must be stable or prerelease")
          \t}
          \treturn validateProxySettings(settings)
          }
          ''')

          Path("app/internal/updater/proxy.go").write_text(r'''package updater

import (
          "errors"
          "net"
          "net/http"
          "net/url"
          "strconv"
          "strings"
          "time"
)

func newHTTPClient(settings Settings) *http.Client {
          transport := http.DefaultTransport.(*http.Transport).Clone()
          transport.ResponseHeaderTimeout = metadataRequestTimeout
          transport.TLSHandshakeTimeout = 15 * time.Second
          // Update proxy settings are explicit. Empty fields mean direct access
          // instead of inheriting an unrelated process-wide proxy environment.
          transport.Proxy = nil
          if host := strings.TrimSpace(settings.ProxyHost); host != "" && settings.ProxyPort > 0 {
                    proxyURL := &url.URL{
                              Scheme: "http",
                              Host:   net.JoinHostPort(host, strconv.Itoa(settings.ProxyPort)),
                    }
                    transport.Proxy = http.ProxyURL(proxyURL)
          }
          return &http.Client{Transport: transport}
}

func (m *Manager) httpClient() *http.Client {
          m.mu.RLock()
          defer m.mu.RUnlock()
          return m.client
}

func validateProxySettings(settings Settings) error {
          host := strings.TrimSpace(settings.ProxyHost)
          port := settings.ProxyPort
          if host == "" && port == 0 {
                    return nil
          }
          if host == "" {
                    return errors.New("update proxy IP/host is required when a proxy port is set")
          }
          if port < 1 || port > 65535 {
                    return errors.New("update proxy port must be between 1 and 65535")
          }
          if strings.Contains(host, "://") || strings.ContainsAny(host, "/\\@ \t\r\n") {
                    return errors.New("update proxy must be an IP address or hostname without scheme, path, or credentials")
          }
          return nil
}
''', encoding="utf-8")

          Path("app/internal/updater/proxy_test.go").write_text(r'''package updater

import (
          "net/http"
          "testing"
)

func TestUpdateProxySettingsPersistAndConfigureTransport(t *testing.T) {
          dataDir := t.TempDir()
          manager, err := NewManager(dataDir, "0.12.13", "owner/repository")
          if err != nil {
                    t.Fatal(err)
          }
          host := "127.0.0.1"
          port := 7890
          settings, err := manager.UpdateSettings(SettingsUpdate{ProxyHost: &host, ProxyPort: &port})
          if err != nil {
                    t.Fatal(err)
          }
          if settings.ProxyHost != host || settings.ProxyPort != port {
                    t.Fatalf("proxy settings = %+v", settings)
          }

          transport, ok := manager.httpClient().Transport.(*http.Transport)
          if !ok {
                    t.Fatalf("HTTP transport type = %T", manager.httpClient().Transport)
          }
          request, err := http.NewRequest(http.MethodGet, "https://api.github.com/repos/owner/repository/releases/latest", nil)
          if err != nil {
                    t.Fatal(err)
          }
          proxyURL, err := transport.Proxy(request)
          if err != nil {
                    t.Fatal(err)
          }
          if proxyURL == nil || proxyURL.String() != "http://127.0.0.1:7890" {
                    t.Fatalf("proxy URL = %v", proxyURL)
          }

          reloaded, err := NewManager(dataDir, "0.12.13", "owner/repository")
          if err != nil {
                    t.Fatal(err)
          }
          got := reloaded.Settings()
          if got.ProxyHost != host || got.ProxyPort != port {
                    t.Fatalf("reloaded proxy = %+v", got)
          }
}

func TestUpdateProxySettingsRequireCompleteAddress(t *testing.T) {
          manager, err := NewManager(t.TempDir(), "0.12.13", "owner/repository")
          if err != nil {
                    t.Fatal(err)
          }
          host := "127.0.0.1"
          zero := 0
          if _, err := manager.UpdateSettings(SettingsUpdate{ProxyHost: &host, ProxyPort: &zero}); err == nil {
                    t.Fatal("expected proxy without port to be rejected")
          }
          empty := ""
          port := 7890
          if _, err := manager.UpdateSettings(SettingsUpdate{ProxyHost: &empty, ProxyPort: &port}); err == nil {
                    t.Fatal("expected proxy port without host to be rejected")
          }
          invalid := "http://127.0.0.1"
          if _, err := manager.UpdateSettings(SettingsUpdate{ProxyHost: &invalid, ProxyPort: &port}); err == nil {
                    t.Fatal("expected proxy host with scheme to be rejected")
          }
}
''', encoding="utf-8")

          types_path = "frontend/src/types/api.ts"
          replace_once(types_path,
          '''export interface UpdateSettings {
            repository: string;
            channel: "stable" | "prerelease";
            checkOnStartup: boolean;
          }
          ''',
          '''export interface UpdateSettings {
            repository: string;
            channel: "stable" | "prerelease";
            checkOnStartup: boolean;
            proxyHost: string;
            proxyPort: number;
          }
          ''')

          store_path = "frontend/src/stores/app.ts"
          replace_once(store_path,
          '''    async saveUpdateSettings(settings: UpdateSettings) {
                this.updateSettings = await this.runAction("save-update-settings", () => api<UpdateSettings>("/api/update/settings", {
                  method: "PUT",
                  body: settings as unknown as BodyInit,
                }));
                useUiStore().toast("更新设置已保存", settings.repository ? `GitHub：${settings.repository}` : "尚未配置 GitHub 仓库。", "success");
                return this.updateSettings;
              },
          ''',
          '''    async saveUpdateSettings(settings: Pick<UpdateSettings, "channel" | "checkOnStartup" | "proxyHost" | "proxyPort">) {
                this.updateSettings = await this.runAction("save-update-settings", () => api<UpdateSettings>("/api/update/settings", {
                  method: "PUT",
                  body: settings as unknown as BodyInit,
                }));
                const proxyLabel = settings.proxyHost && settings.proxyPort
                  ? `更新代理：http://${settings.proxyHost}:${settings.proxyPort}`
                  : "更新代理：直连";
                useUiStore().toast("更新设置已保存", proxyLabel, "success");
                return this.updateSettings;
              },
          ''')

          page = "frontend/src/pages/SettingsPage.vue"
          replace_once(page,
          '''const updateRepository = ref("");
          const updateChannel = ref<"stable" | "prerelease">("stable");
          const updateCheckOnStartup = ref(true);
          const updateChecking = ref(false);
          ''',
          '''const updateChannel = ref<"stable" | "prerelease">("stable");
          const updateCheckOnStartup = ref(true);
          const updateProxyHost = ref("");
          const updateProxyPort = ref("");
          const updateChecking = ref(false);
          ''')

          replace_once(page,
          '''watch(() => app.updateSettings, (settings) => {
            if (!settings) return;
            updateRepository.value = settings.repository;
            updateChannel.value = settings.channel;
            updateCheckOnStartup.value = settings.checkOnStartup;
          }, { immediate: true, deep: true });
          ''',
          '''watch(() => app.updateSettings, (settings) => {
            if (!settings) return;
            updateChannel.value = settings.channel;
            updateCheckOnStartup.value = settings.checkOnStartup;
            updateProxyHost.value = settings.proxyHost || "";
            updateProxyPort.value = settings.proxyPort > 0 ? String(settings.proxyPort) : "";
          }, { immediate: true, deep: true });
          ''')

          replace_once(page,
          '''async function saveUpdatePreferences() {
            try {
              await app.saveUpdateSettings({
                repository: updateRepository.value.trim(),
                channel: updateChannel.value,
                checkOnStartup: updateCheckOnStartup.value,
              });
            } catch (error) {
              ui.toast("保存更新设置失败", error instanceof Error ? error.message : String(error), "danger");
            }
          }

          async function checkForUpdate() {
            if (!updateRepository.value.trim()) {
              ui.toast("请先配置 GitHub 仓库", "格式例如：your-name/mcp-devdesk", "info");
              return;
            }
            updateChecking.value = true;
            try {
              const current = app.updateSettings;
              if (!current || current.repository !== updateRepository.value.trim() || current.channel !== updateChannel.value || current.checkOnStartup !== updateCheckOnStartup.value) {
                await app.saveUpdateSettings({
                  repository: updateRepository.value.trim(),
                  channel: updateChannel.value,
                  checkOnStartup: updateCheckOnStartup.value,
                });
              }
              await app.checkForUpdate(false);
            } catch {
              // checkForUpdate already reports a user-facing error.
            } finally {
              updateChecking.value = false;
            }
          }
          ''',
          '''function updateProxyPayload() {
            const proxyHost = updateProxyHost.value.trim();
            const proxyPortText = updateProxyPort.value.trim();
            if (!proxyHost && !proxyPortText) {
              return { proxyHost: "", proxyPort: 0 };
            }
            if (!proxyHost) {
              ui.toast("代理地址不完整", "请填写代理 IP；不使用代理时 IP 和端口都留空。", "danger");
              return null;
            }
            const proxyPort = Number(proxyPortText);
            if (!Number.isInteger(proxyPort) || proxyPort < 1 || proxyPort > 65535) {
              ui.toast("代理端口无效", "请输入 1 - 65535 之间的代理端口。", "danger");
              return null;
            }
            if (proxyHost.includes("://") || /[\/\\@\s]/.test(proxyHost)) {
              ui.toast("代理 IP 格式无效", "这里只填写 IP 或主机名，不要填写 http://、路径、账号或密码。", "danger");
              return null;
            }
            return { proxyHost, proxyPort };
          }

          async function saveUpdatePreferences() {
            const proxy = updateProxyPayload();
            if (!proxy) return;
            try {
              await app.saveUpdateSettings({
                channel: updateChannel.value,
                checkOnStartup: updateCheckOnStartup.value,
                ...proxy,
              });
            } catch (error) {
              ui.toast("保存更新设置失败", error instanceof Error ? error.message : String(error), "danger");
            }
          }

          async function checkForUpdate() {
            const proxy = updateProxyPayload();
            if (!proxy) return;
            updateChecking.value = true;
            try {
              const current = app.updateSettings;
              if (!current || current.channel !== updateChannel.value || current.checkOnStartup !== updateCheckOnStartup.value || current.proxyHost !== proxy.proxyHost || current.proxyPort !== proxy.proxyPort) {
                await app.saveUpdateSettings({
                  channel: updateChannel.value,
                  checkOnStartup: updateCheckOnStartup.value,
                  ...proxy,
                });
              }
              await app.checkForUpdate(false);
            } catch {
              // checkForUpdate already reports a user-facing error.
            } finally {
              updateChecking.value = false;
            }
          }
          ''')

          replace_once(page,
          '''        <StatusPill :tone="app.updateRelease?.updateAvailable ? 'info' : updateRepository.trim() ? 'neutral' : 'warning'">
                    {{ app.updateRelease?.updateAvailable ? `可更新 ${app.updateRelease.latestVersion}` : updateRepository.trim() ? `当前 ${app.status?.version || '--'}` : '未配置仓库' }}
                  </StatusPill>
                </div>

                <div class="software-update-grid">
                  <label class="field span-2">
                    <span>GitHub 仓库</span>
                    <input v-model.trim="updateRepository" type="text" spellcheck="false" placeholder="owner/repository，例如 your-name/mcp-devdesk" />
                    <small>GitHub Actions 正式构建会自动带入当前仓库；本地源码构建没有 remote 时可在这里手动填写。仅支持公开 GitHub Releases，不需要 Token。</small>
                  </label>
                  <label class="field">
                    <span>更新通道</span>
                    <select v-model="updateChannel">
                      <option value="stable">稳定版</option>
                      <option value="prerelease">测试版 / 预发布版</option>
                    </select>
                  </label>
                  <div class="software-update-toggle">
                    <ToggleSwitch v-model="updateCheckOnStartup" label="启动时检查更新" description="软件启动后只检查一次 GitHub，不会后台频繁请求。" />
                  </div>
                </div>
          ''',
          '''        <StatusPill :tone="app.updateRelease?.updateAvailable ? 'info' : 'neutral'">
                    {{ app.updateRelease?.updateAvailable ? `可更新 ${app.updateRelease.latestVersion}` : `当前 ${app.status?.version || '--'}` }}
                  </StatusPill>
                </div>

                <div class="software-update-grid">
                  <label class="field">
                    <span>更新代理 IP</span>
                    <input v-model.trim="updateProxyHost" type="text" spellcheck="false" placeholder="例如 127.0.0.1" />
                    <small>可选 HTTP 代理。只填写 IP 或主机名；留空表示直连 GitHub。</small>
                  </label>
                  <label class="field">
                    <span>代理端口</span>
                    <input v-model="updateProxyPort" type="number" min="1" max="65535" inputmode="numeric" placeholder="例如 7890" />
                    <small>与代理 IP 配套使用，例如 Clash 常用 7890。</small>
                  </label>
                  <label class="field">
                    <span>更新通道</span>
                    <select v-model="updateChannel">
                      <option value="stable">稳定版</option>
                      <option value="prerelease">测试版 / 预发布版</option>
                    </select>
                  </label>
                  <div class="software-update-toggle">
                    <ToggleSwitch v-model="updateCheckOnStartup" label="启动时检查更新" description="软件启动后只检查一次；检查版本、SHA256 和下载更新包都会使用上面的代理。" />
                  </div>
                </div>
          ''')

          replace_once(page,
          '''          <AppButton tone="secondary" icon="refresh" :loading="updateChecking" :disabled="!updateRepository.trim()" @click="checkForUpdate">检查更新</AppButton>
          ''',
          '''          <AppButton tone="secondary" icon="refresh" :loading="updateChecking" @click="checkForUpdate">检查更新</AppButton>
          ''')

          replace_once(page,
          '''          <p>从公开 GitHub Releases 检查并安装新版本。下载包必须同时提供 SHA256 文件，否则 DevDesk 会拒绝更新。</p>
          ''',
          '''          <p>从内置 GitHub Releases 更新源检查并安装新版本。可选填写 HTTP 代理 IP 和端口；下载包仍必须通过 SHA256 校验。</p>
          ''')

          docs = Path("docs/RELEASE.md")
          docs_text = docs.read_text(encoding="utf-8")
          note = '''\n## 软件更新代理\n\nMCP DevDesk 的更新源固定为构建内置的 GitHub 仓库，不在界面提供可编辑仓库地址。软件设置可选填写 HTTP 代理 IP/主机名与端口；填写后 GitHub Release 检查、SHA256 下载和 Portable ZIP 下载统一走该代理，留空则直连。代理设置仅影响软件更新，不影响 MCP Core、Cloudflare Tunnel 或项目网络访问。\n'''
          if "## 软件更新代理" not in docs_text:
              docs.write_text(docs_text.rstrip() + "\n" + note, encoding="utf-8")
          PY

      - name: Format Go files
        shell: bash
        run: |
          gofmt -w app/internal/updater/manager.go app/internal/updater/proxy.go app/internal/updater/proxy_test.go

      - name: Remove one-shot workflow
        shell: bash
        run: rm .github/workflows/apply-updater-proxy-fix.yml

      - name: Commit updater proxy fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: add proxy support for software updates"
          git push origin HEAD:main
