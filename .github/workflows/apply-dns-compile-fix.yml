name: Apply DNS compile fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/fix_dns_repair_compile.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - run: python3 .github/scripts/fix_dns_repair_compile.py
      - run: gofmt -w app/internal/tunnel/cloudflare.go
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/internal/tunnel/cloudflare.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: compile DNS verification path"
          git push origin HEAD:main
