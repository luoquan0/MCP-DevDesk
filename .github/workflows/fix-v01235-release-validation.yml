name: Fix v0.12.35 release validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-release-validation:
    if: github.head_ref == 'fix/v0.12.35-release-validation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply focused profile fix and remove helper workflow
        shell: pwsh
        run: |
          $path = "app\internal\mcpcore\server.go"
          $text = Get-Content -LiteralPath $path -Raw -Encoding utf8
          $old = 'tools = append(tools, previewFileTools()...)'
          $new = @'
          previewTools := previewFileTools()
          if options.ToolProfile == "read-only" {
              previewTools = filterTools(previewTools, func(tool Tool) bool {
                  return tool.Name != "checks_run" && tool.Name != "validate_project"
              })
          }
          tools = append(tools, previewTools...)
          '@
          if (-not $text.Contains($old)) {
            throw "Expected previewFileTools append was not found"
          }
          $text = $text.Replace($old, $new.Trim())
          Set-Content -LiteralPath $path -Value $text -Encoding utf8 -NoNewline

          Push-Location app
          try {
            gofmt -w internal/mcpcore/server.go
            if ($LASTEXITCODE -ne 0) { throw "gofmt failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          git rm -- ".github/workflows/fix-v01235-release-validation.yml"
          git add -- "$path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: enforce read-only validation profile"
          git push origin "HEAD:${{ github.head_ref }}"
