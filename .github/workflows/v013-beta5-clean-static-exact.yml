name: MCP DevDesk v0.13 Beta 5 Exact Static Cleanup

on:
  push:
    branches:
      - fix/v0.13.0-beta5-console-utf8-probe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.13.0-beta5-console-utf8-probe
          fetch-depth: 0
      - name: Replace static tree with preview baseline exactly
        shell: pwsh
        run: |
          git fetch origin preview/v0.13.0
          git rm -r -f -- app/internal/web/static
          git checkout origin/preview/v0.13.0 -- app/internal/web/static
          git diff --check
          if (git diff --quiet -- app/internal/web/static) {
            Write-Host 'Static tree exactly matches preview baseline.'
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/internal/web/static
          git diff --cached --check
          git commit -m "chore: exactly restore generated static baseline"
          git push origin HEAD:fix/v0.13.0-beta5-console-utf8-probe
