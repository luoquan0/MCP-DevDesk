name: Apply updater proxy v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/apply_update_proxy_v2.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply_update_proxy_v2.py

      - name: Format Go
        run: gofmt -w app/internal/updater/manager.go app/internal/updater/proxy.go app/internal/updater/proxy_test.go app/internal/application/app.go app/internal/web/server.go

      - name: Verify patch
        run: git diff --check

      - name: Remove one-shot patch files
        run: |
          rm -f .github/scripts/apply_update_proxy_v2.py
          rm -f .github/workflows/apply-update-proxy-v2.yml

      - name: Commit and publish fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair updater proxy controls and add proxy test [release]"
          git push origin HEAD:main
