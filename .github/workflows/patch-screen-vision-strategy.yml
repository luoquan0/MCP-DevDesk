name: Patch Screen Vision Strategy

on:
  push:
    branches:
      - "fix/screen-vision-default-strategy"

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[screen-strategy-patched]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/screen-vision-default-strategy
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply strategy patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected source block not found in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace_once(
              "app/internal/mcpcore/server.go",
              '''func (s *Server) initializeInstructions() string {
          \tbase := "MCP DevDesk Go core. Use the exposed tools only within the configured workspace and permission policy."
          \tmanagedInstructions := s.currentManagedInstructions()
          \tprojectRules := s.currentProjectRules()
          \tif managedInstructions == "" && len(projectRules) == 0 {
          \t\treturn base
          \t}
          \tvar builder strings.Builder
          \tbuilder.WriteString(base)
          ''',
              '''func (s *Server) initializeInstructions() string {
          \tbase := "MCP DevDesk Go core. Use the exposed tools only within the configured workspace and permission policy."
          \tscreenVisionInstructions := s.screenVisionDefaultInstructions()
          \tmanagedInstructions := s.currentManagedInstructions()
          \tprojectRules := s.currentProjectRules()
          \tif screenVisionInstructions == "" && managedInstructions == "" && len(projectRules) == 0 {
          \t\treturn base
          \t}
          \tvar builder strings.Builder
          \tbuilder.WriteString(base)
          \tif screenVisionInstructions != "" {
          \t\tbuilder.WriteString("\\n\\nMCP DevDesk default desktop visual inspection policy:\\n\\n")
          \t\tbuilder.WriteString(screenVisionInstructions)
          \t\tif !strings.HasSuffix(screenVisionInstructions, "\\n") {
          \t\t\tbuilder.WriteByte('\\n')
          \t\t}
          \t}
          ''')

          replace_once(
              "app/internal/mcpcore/screen_tools.go",
              'Description: "List captureable top-level Windows application windows, including minimized apps and tray-hidden main windows when Windows keeps a restorable top-level surface. Screen Vision is explicit opt-in and this tool never starts continuous recording.",',
              'Description: "Use this first by default when the user names an open or background app and asks what its GUI currently shows; then pass the returned window id to screen_capture_window. Process, port, or service presence alone does not answer a GUI-content question. Includes minimized apps and tray-hidden main windows when Windows keeps a restorable top-level surface. No screenshot is taken and continuous recording is never started.",')
          replace_once(
              "app/internal/mcpcore/screen_tools.go",
              'Description: "Return metadata for the current foreground window without taking a screenshot.",',
              'Description: "Return metadata for the current foreground window without taking a screenshot. Use screen_capture_active_window, not this metadata alone, when the user asks what the current window visually displays.",')
          replace_once(
              "app/internal/mcpcore/screen_tools.go",
              'Description: "Capture one explicitly selected Windows application window on demand, including a background, minimized, or tray-hidden target when Windows keeps a restorable main surface. Dormant targets are temporarily restored without focus and returned to their prior state. Nothing is saved to disk.",',
              'Description: "Primary GUI inspection tool for a named, open, or background app. When the user asks what an app window currently displays, use this after screen_list_windows instead of answering from process/port metadata or asking the user to bring the app forward. Background, minimized, and tray-hidden targets are captured when Windows keeps a restorable main surface; dormant targets are temporarily restored without focus and returned to their prior state. Only ask the user to foreground the app after this capture actually fails. Nothing is saved to disk.",')
          replace_once(
              "app/internal/mcpcore/screen_tools.go",
              'Description: "Capture the current foreground window on demand and return a PNG image to the MCP client. Nothing is saved to disk.",',
              'Description: "Primary GUI inspection tool when the user asks what the current foreground/current window visually displays. Use it before relying on process/port metadata. Capture the current foreground window on demand and return a PNG image to the MCP client. Nothing is saved to disk.",')
          replace_once(
              "app/internal/mcpcore/screen_tools.go",
              'Description: "Capture the Windows virtual desktop across connected monitors on demand and return a PNG image. Nothing is saved to disk.",',
              'Description: "Capture the Windows virtual desktop across connected monitors for an overview. For a named background app, prefer screen_list_windows plus screen_capture_window because a desktop overview is not a substitute for inspecting that app directly. Nothing is saved to disk.",')

          policy = Path("app/internal/mcpcore/screen_policy.go")
          policy_text = policy.read_text(encoding="utf-8")
          marker = "func (s *Server) screenVisionDefaultInstructions() string {"
          if marker not in policy_text:
              insertion = r'''

          func (s *Server) screenVisionDefaultInstructions() string {
          \tif !s.screenCaptureEnabled || (s.permissionMode != "trusted" && s.permissionMode != "dangerous") {
          \t\treturn ""
          \t}
          \tvalue, ok := screenVisionPolicies.Load(s)
          \tif !ok {
          \t\treturn ""
          \t}
          \tpolicy, ok := value.(screenVisionPolicy)
          \tif !ok {
          \t\treturn ""
          \t}
          \tswitch policy.mode {
          \tcase "desktop":
          \t\treturn "When the user asks what a named, open, or background application window currently displays, treat it as a GUI-content question and use Screen Vision before process, port, service, or command metadata. Use screen_list_windows to locate the app and screen_capture_window to inspect its pixels. When the user asks what the current foreground window displays, use screen_capture_active_window. If a target is minimized or tray-hidden, call screen_capture_window directly; it automatically attempts a no-focus temporary restore, full-window capture, and restoration of the previous state. Only ask the user to bring the app to the foreground after an actual Screen Vision capture attempt fails or reports the target unavailable. Process/port metadata may supplement the visual result but does not answer what the GUI shows. screen_capture_desktop is for a desktop overview, not a substitute for capturing a named background app."
          \tcase "window":
          \t\treturn "When the user asks what the selected or locked application window displays, use screen_capture_window first. The locked target may be behind another app or minimized/tray-hidden; capture already handles background access, no-focus temporary restoration when needed, and state restoration. Do not ask the user to foreground the target before trying Screen Vision. Only request foregrounding after the capture tool itself fails. Process/port metadata may supplement the result but cannot replace GUI inspection."
          \tdefault:
          \t\treturn "When the user asks what the current window or currently visible application displays, use screen_capture_active_window first. Do not answer a GUI-content question only from process/port metadata. Only ask the user to change or foreground a window after the Screen Vision capture itself fails."
          \t}
          }
          '''
              anchor = "\nfunc (s *Server) ConfigureScreenVision("
              if anchor not in policy_text:
                  raise SystemExit("ConfigureScreenVision anchor not found")
              policy_text = policy_text.replace(anchor, insertion + anchor, 1)
              policy.write_text(policy_text, encoding="utf-8", newline="\n")

          replace_once(
              "app/internal/mcpcore/screen_policy.go",
              'tool.Description = "Capture only the Windows application window selected in MCP DevDesk, including when it is behind another app or minimized. Minimized targets are temporarily restored without focus and minimized again. Omit window to use the locked target; another window id is rejected. Nothing is saved to disk."',
              'tool.Description = "Default GUI inspection tool for the Windows application window selected in MCP DevDesk. Use it first when the user asks what the locked app visually displays; do not substitute process/port metadata or ask the user to foreground it first. The target may be behind another app, minimized, or tray-hidden; capture attempts temporarily restore dormant targets without focus when needed and return them to their previous state. Only ask the user to foreground the app after this capture actually fails. Omit window to use the locked target; another window id is rejected. Nothing is saved to disk."')

          test_path = Path("app/internal/mcpcore/screen_default_strategy_test.go")
          test_path.write_text(r'''package mcpcore

          import (
          \t"strings"
          \t"testing"
          )

          func TestScreenVisionDefaultInstructionsMatchMode(t *testing.T) {
          \tcases := []struct {
          \t\tname       string
          \t\tmode       string
          \t\twindowID   string
          \t\twant       []string
          \t\tnotWanted  []string
          \t}{
          \t\t{
          \t\t\tname: "desktop",
          \t\t\tmode: "desktop",
          \t\t\twant: []string{"default desktop visual inspection policy", "screen_list_windows", "screen_capture_window", "screen_capture_active_window", "process/port metadata", "after an actual Screen Vision capture attempt fails"},
          \t\t},
          \t\t{
          \t\t\tname: "specified window",
          \t\t\tmode: "window",
          \t\t\twindowID: "123",
          \t\t\twant: []string{"default desktop visual inspection policy", "screen_capture_window", "locked", "foreground", "after the capture tool itself fails"},
          \t\t\tnotWanted: []string{"screen_capture_active_window first"},
          \t\t},
          \t\t{
          \t\t\tname: "active",
          \t\t\tmode: "active",
          \t\t\twant: []string{"default desktop visual inspection policy", "screen_capture_active_window first", "process/port metadata", "after the Screen Vision capture itself fails"},
          \t\t\tnotWanted: []string{"screen_list_windows to locate"},
          \t\t},
          \t}
          \tfor _, tc := range cases {
          \t\tt.Run(tc.name, func(t *testing.T) {
          \t\t\tserver, err := New(Options{Workspace: t.TempDir(), PermissionMode: "trusted", ScreenCaptureEnabled: true})
          \t\t\tif err != nil {
          \t\t\t\tt.Fatal(err)
          \t\t\t}
          \t\t\tdefer server.Close()
          \t\t\tserver.ConfigureScreenVision(tc.mode, tc.windowID, 456)
          \t\t\tinstructions := server.initializeInstructions()
          \t\t\tfor _, want := range tc.want {
          \t\t\t\tif !strings.Contains(instructions, want) {
          \t\t\t\t\tt.Fatalf("instructions for %s missing %q:\\n%s", tc.mode, want, instructions)
          \t\t\t\t}
          \t\t\t}
          \t\t\tfor _, notWanted := range tc.notWanted {
          \t\t\t\tif strings.Contains(instructions, notWanted) {
          \t\t\t\t\tt.Fatalf("instructions for %s unexpectedly contain %q:\\n%s", tc.mode, notWanted, instructions)
          \t\t\t\t}
          \t\t\t}
          \t\t})
          \t}
          }

          func TestScreenVisionDefaultInstructionsNotAdvertisedWhenUnavailable(t *testing.T) {
          \tcases := []Options{
          \t\t{Workspace: t.TempDir(), PermissionMode: "trusted", ScreenCaptureEnabled: false},
          \t\t{Workspace: t.TempDir(), PermissionMode: "safe", ScreenCaptureEnabled: true},
          \t}
          \tfor _, options := range cases {
          \t\tserver, err := New(options)
          \t\tif err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          \t\tserver.ConfigureScreenVision("desktop", "", 0)
          \t\tinstructions := server.initializeInstructions()
          \t\tserver.Close()
          \t\tif strings.Contains(instructions, "default desktop visual inspection policy") {
          \t\t\tt.Fatalf("unavailable Screen Vision must not be advertised:\\n%s", instructions)
          \t\t}
          \t}
          }

          func TestScreenToolDescriptionsPreferDirectGUIInspection(t *testing.T) {
          \tdescriptions := map[string]string{}
          \tfor _, tool := range screenTools() {
          \t\tdescriptions[tool.Name] = tool.Description
          \t}
          \tchecks := map[string][]string{
          \t\t"screen_list_windows": {"first by default", "GUI", "screen_capture_window", "Process, port"},
          \t\t"screen_capture_window": {"Primary GUI inspection tool", "process/port metadata", "Only ask the user to foreground"},
          \t\t"screen_capture_active_window": {"Primary GUI inspection tool", "current foreground/current window"},
          \t\t"screen_capture_desktop": {"overview", "named background app", "screen_capture_window"},
          \t}
          \tfor name, fragments := range checks {
          \t\tdescription := descriptions[name]
          \t\tfor _, fragment := range fragments {
          \t\t\tif !strings.Contains(description, fragment) {
          \t\t\t\tt.Fatalf("%s description missing %q: %s", name, fragment, description)
          \t\t\t}
          \t\t}
          \t}
          }
          '''.replace("\\t", "\t"), encoding="utf-8", newline="\n")

          docs = Path("docs/SCREEN_VISION.md")
          docs_text = docs.read_text(encoding="utf-8")
          docs_marker = "## 默认 AI 桌面视觉读取策略"
          if docs_marker not in docs_text:
              docs_text += r'''

          ## 默认 AI 桌面视觉读取策略

          当 Screen Vision 已启用且当前权限/模式允许相应工具时，MCP Core 会在初始化 instructions 和工具描述中向模型声明以下默认策略：

          - 用户询问“某个软件界面现在显示什么”“后台软件内容是什么”时，应把它视为 GUI 内容问题，优先直接抓取窗口画面，而不是只检查进程、端口、服务或命令行状态。
          - `desktop` 模式下，已命名/后台应用优先 `screen_list_windows` 定位目标，再用 `screen_capture_window` 读取；“当前窗口显示什么”优先 `screen_capture_active_window`。
          - `window` 模式下，优先直接读取 DevDesk 已锁定的目标窗口；目标被浏览器遮挡、最小化或隐藏到托盘时，不要求用户先切前台。
          - `active` 模式下，只针对 Windows 当前前台窗口使用 `screen_capture_active_window`，不越权枚举或读取其他后台窗口。
          - 最小化/托盘目标继续由捕获实现自动尝试无焦点临时恢复、重新绑定有效主 HWND、等待稳定渲染、截图并恢复原状态。
          - 只有实际 Screen Vision 捕获已经失败或明确报告目标不可读取后，模型才应请求用户手动把软件切到前台。
          - 进程、端口、服务等元数据可以作为视觉结果的补充，但不能替代“界面现在显示什么”的像素证据。
          - `screen_capture_desktop` 用于桌面总览；如果用户明确问某个后台软件的界面，应优先单独捕获该窗口，而不是仅依赖桌面总览。

          这是一项工具选择默认策略，不会扩大 Screen Vision 的权限边界。实际可调用工具仍由 `active` / `window` / `desktop` 模式、用户显式开关和 permission mode 共同限制。
          '''
              docs.write_text(docs_text, encoding="utf-8", newline="\n")
          '@ | Set-Content -LiteralPath patch_strategy.py -Encoding utf8
          python patch_strategy.py
          Remove-Item patch_strategy.py -Force
          gofmt -w app/internal/mcpcore/server.go app/internal/mcpcore/screen_policy.go app/internal/mcpcore/screen_tools.go app/internal/mcpcore/screen_default_strategy_test.go

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci

      - name: Full Windows build and tests
        shell: pwsh
        run: .\build.ps1 -Arch amd64 -RunTests

      - name: Commit validated patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/internal/mcpcore/server.go app/internal/mcpcore/screen_policy.go app/internal/mcpcore/screen_tools.go app/internal/mcpcore/screen_default_strategy_test.go docs/SCREEN_VISION.md
          git diff --cached --quiet && throw "strategy patch produced no source changes"
          git commit -m "fix: make Screen Vision the default GUI inspection strategy [screen-strategy-patched] [skip release]"
          git push origin HEAD:fix/screen-vision-default-strategy
