name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci

      - name: Guard public repository secrets
        shell: pwsh
        run: .\tools\check-public-release.ps1

      - name: Build and test
        shell: pwsh
        env:
          MCP_DEVDESK_GITHUB_REPOSITORY: ${{ github.repository }}
        run: .\build.ps1 -Arch amd64 -RunTests

      - name: Build NSIS setup smoke
        shell: pwsh
        run: |
          $versionText = Get-Content -LiteralPath "app\internal\buildinfo\version.go" -Raw -Encoding utf8
          $match = [regex]::Match($versionText, 'const Version = "([^"]+)"')
          if (-not $match.Success) {
            throw "Could not resolve source version for CI installer build"
          }
          $version = $match.Groups[1].Value
          $stage = (Resolve-Path ".\dist\MCP-DevDesk-Portable-amd64").Path
          $output = (Join-Path (Resolve-Path ".\dist").Path "MCP-DevDesk-Setup-CI-x64.exe")
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis)) {
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path -LiteralPath $makensis)) {
            throw "NSIS makensis.exe is unavailable"
          }
          & $makensis "/DVERSION=$version" "/DSTAGEDIR=$stage" "/DOUTFILE=$output" ".\installer\MCP-DevDesk.nsi"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $output)) {
            throw "NSIS CI setup build failed"
          }

      - name: Test setup cloudflared preservation
        shell: pwsh
        run: |
          .\tools\test-setup-cloudflared-preservation.ps1 `
            -SetupPath ".\dist\MCP-DevDesk-Setup-CI-x64.exe" `
            -BundledCloudflaredPath ".\dist\MCP-DevDesk-Portable-amd64\cloudflared.exe"

