name: Apply updater proxy runtime fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply updater proxy runtime fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Apply proxy runtime patch
        run: |
          python tools/apply_updater_proxy_runtime_fix.py
          gofmt -w app/internal/updater/proxy.go app/internal/updater/proxy_test.go

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/internal/updater/proxy.go app/internal/updater/proxy_test.go
          git commit -m "fix: repair SOCKS5 updater fallback lifetime"
          git push
