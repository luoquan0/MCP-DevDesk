name: Harden Screen Vision Rebind Identity

on:
  push:
    branches:
      - "fix/screen-vision-rebind-stable"

permissions:
  contents: write

jobs:
  harden-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Harden identity match
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("app/internal/mcpcore/screen_minimized_windows.go")
          text = path.read_text(encoding="utf-8")
          old = '''\tif strings.TrimSpace(original.ProcessName) != "" && strings.TrimSpace(candidate.ProcessName) != "" && !strings.EqualFold(original.ProcessName, candidate.ProcessName) {
          \t\treturn false
          \t}'''
          new = '''\tif strings.TrimSpace(original.ProcessName) != "" && !strings.EqualFold(strings.TrimSpace(original.ProcessName), strings.TrimSpace(candidate.ProcessName)) {
          \t\treturn false
          \t}'''
          if old not in text:
              raise SystemExit("identity match block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("app/internal/mcpcore/screen_minimized_windows_test.go")
          body = tests.read_text(encoding="utf-8")
          addition = r'''

          func TestScreenVisionRestoredIdentityRequiresResolvedProcessName(t *testing.T) {
          	original := screenWindow{ProcessID: 55, ProcessName: "v2rayN.exe"}
          	if screenVisionRestoredIdentityMatches(original, screenWindow{ProcessID: 55}) {
          		t.Fatal("replacement with an unresolved process name must not inherit a known target identity")
          	}
          	if !screenVisionRestoredIdentityMatches(original, screenWindow{ProcessID: 55, ProcessName: "V2RAYN.EXE"}) {
          		t.Fatal("same PID and process name should preserve identity case-insensitively")
          	}
          	if screenVisionRestoredIdentityMatches(original, screenWindow{ProcessID: 56, ProcessName: "v2rayN.exe"}) {
          		t.Fatal("different PID must never be rebound")
          	}
          }
          '''
          if "TestScreenVisionRestoredIdentityRequiresResolvedProcessName" not in body:
              tests.write_text(body + addition, encoding="utf-8")
          '@ | Set-Content -Path harden_rebind.py -Encoding UTF8
          python harden_rebind.py
      - name: Format Go
        shell: pwsh
        run: |
          Set-Location app
          gofmt -w internal/mcpcore/screen_minimized_windows.go internal/mcpcore/screen_minimized_windows_test.go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci
      - name: Guard public repository secrets
        shell: pwsh
        run: .\tools\check-public-release.ps1
      - name: Build and test
        shell: pwsh
        env:
          MCP_DEVDESK_GITHUB_REPOSITORY: ${{ github.repository }}
        run: .\build.ps1 -Arch amd64 -RunTests
      - name: Commit validated hardening
        shell: pwsh
        run: |
          Remove-Item harden_rebind.py -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/internal/mcpcore/screen_minimized_windows.go app/internal/mcpcore/screen_minimized_windows_test.go
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "fix: harden Screen Vision HWND rebind identity"
          git push origin HEAD:${{ github.ref_name }}
