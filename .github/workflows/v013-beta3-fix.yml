name: MCP DevDesk v0.13 Beta 3 Fix

on:
  push:
    branches:
      - "preview/v0.13.0"
    paths:
      - "tools/v013_beta3_fix.py"
      - ".github/workflows/v013-beta3-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-persist:
    runs-on: windows-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/v0.13.0
          fetch-depth: 0

      - name: Apply Beta 3 source migration
        shell: pwsh
        run: python tools/v013_beta3_fix.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Format changed Go sources
        shell: pwsh
        run: |
          gofmt -w app\internal\mcpcore\code_navigation.go
          gofmt -w app\internal\mcpcore\ui_automation_windows.go
          gofmt -w app\internal\mcpcore\ui_automation_windows_test.go
          gofmt -w app\internal\mcpcore\server_test.go
          gofmt -w app\internal\buildinfo\version.go
          git diff --check

      - name: Beta 3 targeted MCP tests
        shell: pwsh
        run: |
          Set-Location app
          go test -mod=vendor ./internal/mcpcore -run 'TestV013ToolCatalogContainsNewGroups|TestUIAutomationPowerShellHelpersHandleScalarValues|TestExposedToolSchemasAreValidAndUnique|TestInitializeListAndCallTools' -count=1

      - name: Go full tests
        shell: pwsh
        run: |
          Set-Location app
          go test -mod=vendor ./... -count=1

      - name: Version and documentation consistency
        shell: pwsh
        run: |
          $versionText = Get-Content app\internal\buildinfo\version.go -Raw
          if (-not $versionText.Contains('0.13.0-beta.3')) { throw 'buildinfo version was not upgraded to beta.3' }
          $preview = Get-Content docs\V013_PREVIEW.md -Raw
          $roadmap = Get-Content docs\ROADMAP.md -Raw
          if (-not $preview.Contains('0.13.0-beta.3')) { throw 'preview docs missing beta.3' }
          if (-not $roadmap.Contains('0.13.0-beta.3')) { throw 'roadmap missing beta.3' }
          if (-not $preview.Contains('screen_capture_probe')) { throw 'preview docs lost screen probe coverage' }

      - name: Persist validated Beta 3 source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/internal/mcpcore/code_navigation.go app/internal/mcpcore/ui_automation_windows.go app/internal/mcpcore/ui_automation_windows_test.go app/internal/mcpcore/server_test.go app/internal/buildinfo/version.go docs/V013_PREVIEW.md docs/ROADMAP.md
          if (git diff --cached --quiet) {
            Write-Host "No Beta 3 source changes to persist."
            exit 0
          }
          git commit -m "fix: beta3 tool catalog and UI automation"
          git push origin HEAD:preview/v0.13.0
